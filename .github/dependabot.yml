# Dependabot: automatic dependency PRs.
# Weekly, grouped by ecosystem and WITHOUT auto-merge: CI validates, a human decides.
# Security updates open as soon as they are announced (they do not wait a week).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: "/apps/android"
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
