name: Restore drill

# Quarterly restore drill (docs/infrastructure.md §5): restores the latest
# snapshot into a disposable PostgreSQL 17 and checks the product tables.
# Manual only; inactive until the backup secrets exist.

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Snapshot ID to restore ("latest" for the newest one)
        required: false
        default: latest
  push:
    branches: [fix/restore-drill-pgoptions]

permissions: {}

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check configuration
        id: config
        env:
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$RESTIC_REPOSITORY" ] && [ -n "$RESTIC_PASSWORD" ] \
            && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Backup secrets are not configured; skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install restic
        if: steps.config.outputs.enabled == 'true'
        run: |
          version=0.19.1
          sha256=f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
          curl -fsSLo restic.bz2 \
            "https://github.com/restic/restic/releases/download/v${version}/restic_${version}_linux_amd64.bz2"
          echo "${sha256}  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2
          sudo install -m 0755 restic /usr/local/bin/restic
          restic version

      - name: Install PostgreSQL client
        if: steps.config.outputs.enabled == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/psql --version

      # The dump depends on Supabase's predefined roles and the `auth` schema
      # (policies call auth.uid() and FKs point at auth.users); a vanilla
      # PostgreSQL lacks both and a new Supabase project already has them.
      - name: Prepare the disposable database
        if: steps.config.outputs.enabled == 'true'
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key);
          create or replace function auth.uid() returns uuid
            language sql stable
            as $$
              select nullif(
                coalesce(nullif(current_setting('request.jwt.claims', true), ''), '{}')::jsonb ->> 'sub',
                ''
              )::uuid
            $$;

          do $$
          declare r text;
          begin
            foreach r in array array[
              'anon', 'authenticated', 'service_role', 'supabase_admin',
              'supabase_auth_admin', 'supabase_storage_admin', 'authenticator',
              'core_cron', 'module_installer'
            ] loop
              if not exists (select 1 from pg_roles where rolname = r) then
                execute format('create role %I nologin noinherit', r);
              end if;
            end loop;
          end $$;
          SQL

      - name: Restore the snapshot
        if: steps.config.outputs.enabled == 'true'
        env:
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # A public-only dump has no auth.users rows, so the FKs that point
          # there cannot be validated during the drill.
          PGOPTIONS: -c session_replication_role=replica
        run: |
          bash scripts/backup/restore.sh \
            --target "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            --snapshot "${{ inputs.snapshot }}" \
            --schema public

      # A restore that creates no product tables is not a successful drill.
      - name: Verify the restored data
        if: steps.config.outputs.enabled == 'true'
        run: |
          target="postgresql://postgres:postgres@127.0.0.1:5432/postgres"
          tables=$(psql "$target" -Atc \
            "select count(*) from information_schema.tables where table_schema = 'public'")
          settings=$(psql "$target" -Atc \
            "select count(*) from public.settings" 2>/dev/null || echo 0)
          migrations=$(psql "$target" -Atc \
            "select count(*) from supabase_migrations.schema_migrations" 2>/dev/null || echo 0)
          echo "public tables: ${tables}"
          echo "settings rows: ${settings}"
          echo "migration rows: ${migrations}"
          if [ "${tables}" -lt 1 ]; then
            echo "::error::The restore produced no public tables."
            exit 1
          fi
          {
            echo "### Restore drill"
            echo ""
            echo "| Check | Value |"
            echo "|---|---|"
            echo "| Snapshot | \`${{ inputs.snapshot }}\` |"
            echo "| Public tables | ${tables} |"
            echo "| Settings rows | ${settings} |"
            echo "| Migration rows | ${migrations} |"
          } >> "$GITHUB_STEP_SUMMARY"
