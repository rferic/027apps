name: Keep alive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      PROD_URL: ${{ secrets.PROD_URL }}
    steps:
      - name: Ping production health endpoint
        if: env.PROD_URL != ''
        run: curl --fail --silent --show-error --max-time 30 "${PROD_URL%/}/api/health" > /dev/null
